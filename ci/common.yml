# Shared job template for both the SDX and VPX pipelines.
#
# Uses a stock python:3.12-slim image and installs the small set of CLI
# tools needed (ssh/scp, smbclient, snmp, jq) on every job. If pipeline
# start-up time becomes a problem, build docker/tooling.Dockerfile once,
# push it to your project's container registry, and point `.base.image`
# at it instead - see docs/PIPELINE.md.
.base:
  image: python:3.12-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends openssh-client sshpass smbclient snmp jq curl ca-certificates >/dev/null
    - pip install --quiet --disable-pip-version-check boto3
    - find scripts -name '*.sh' -exec chmod +x {} +
    - mkdir -p "${ARTIFACT_DIR}"
  artifacts:
    when: always
    expire_in: "90 days"
